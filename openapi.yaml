openapi: 3.0.0
info:
  title: Medical API System
  version: 1.0.0
  description: REST API for managing patient medical records, examinations, samples, prescriptions, and referrals

servers:
  - url: http://localhost:8080/api

paths:
  # Patient endpoints
  /patients:
    get:
      summary: Get all patients
      responses:
        '200':
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
    post:
      summary: Create new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          description: Invalid request

  /patients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get patient by ID
      responses:
        '200':
          description: Patient details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found
    put:
      summary: Update patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        '200':
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found
    delete:
      summary: Delete patient
      responses:
        '204':
          description: Patient deleted
        '404':
          description: Patient not found

  # Examination endpoints
  /examinations:
    get:
      summary: Get all examinations
      responses:
        '200':
          description: List of examinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Examination'
    post:
      summary: Create new examination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExaminationRequest'
      responses:
        '201':
          description: Examination created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Examination'
        '400':
          description: Invalid request

  /examinations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get examination by ID
      responses:
        '200':
          description: Examination details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Examination'
        '404':
          description: Examination not found
    put:
      summary: Update examination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExaminationRequest'
      responses:
        '200':
          description: Updated examination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Examination'
        '404':
          description: Examination not found
    delete:
      summary: Delete examination
      responses:
        '204':
          description: Examination deleted
        '404':
          description: Examination not found

  /examinations/patient/{patientId}:
    parameters:
      - name: patientId
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get examinations by patient ID
      responses:
        '200':
          description: List of examinations for a patient
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Examination'
                  
  # Sample endpoints
  /samples:
    get:
      summary: Get all samples
      responses:
        '200':
          description: List of samples
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sample'
    post:
      summary: Create new sample (triggers automatic evaluation and prescription generation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleRequest'
      responses:
        '201':
          description: Sample created, evaluated and prescription generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
        '400':
          description: Invalid request

  /samples/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get sample by ID
      responses:
        '200':
          description: Sample details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
        '404':
          description: Sample not found
    put:
      summary: Update sample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSampleRequest'
      responses:
        '200':
          description: Updated sample
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
        '404':
          description: Sample not found
    delete:
      summary: Delete sample
      responses:
        '204':
          description: Sample deleted
        '404':
          description: Sample not found

  /samples/examination/{examinationId}:
    parameters:
      - name: examinationId
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get samples by examination ID
      responses:
        '200':
          description: List of samples for an examination
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sample'
                  
  # Prescription endpoints
  /prescriptions:
    get:
      summary: Get all prescriptions
      responses:
        '200':
          description: List of prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prescription'
    post:
      summary: Create new prescription (manual creation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionRequest'
      responses:
        '201':
          description: Prescription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '400':
          description: Invalid request

  /prescriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get prescription by ID
      responses:
        '200':
          description: Prescription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '404':
          description: Prescription not found
    put:
      summary: Update prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrescriptionRequest'
      responses:
        '200':
          description: Updated prescription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '404':
          description: Prescription not found
    delete:
      summary: Delete prescription
      responses:
        '204':
          description: Prescription deleted
        '404':
          description: Prescription not found

  /prescriptions/examination/{examinationId}:
    parameters:
      - name: examinationId
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get prescriptions by examination ID
      responses:
        '200':
          description: List of prescriptions for an examination
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prescription'
                  
  /prescriptions/{id}/validate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Validate prescription by doctor
      responses:
        '200':
          description: Prescription validated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  prescription:
                    $ref: '#/components/schemas/Prescription'
        '404':
          description: Prescription not found
          
  /prescriptions/{id}/send:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Send prescription to pharmacy (requires validation first)
      responses:
        '200':
          description: Prescription sent to pharmacy
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  prescription:
                    $ref: '#/components/schemas/Prescription'
        '404':
          description: Prescription not found or not validated

  # Referral endpoints
  /referrals:
    get:
      summary: Get all referrals
      responses:
        '200':
          description: List of referrals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Referral'
    post:
      summary: Create new referral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralRequest'
      responses:
        '201':
          description: Referral created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Referral'
        '400':
          description: Invalid request

  /referrals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get referral by ID
      responses:
        '200':
          description: Referral details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Referral'
        '404':
          description: Referral not found
    put:
      summary: Update referral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReferralRequest'
      responses:
        '200':
          description: Updated referral
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Referral'
        '404':
          description: Referral not found
    delete:
      summary: Delete referral
      responses:
        '204':
          description: Referral deleted
        '404':
          description: Referral not found

  /referrals/examination/{examinationId}:
    parameters:
      - name: examinationId
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get referrals by examination ID
      responses:
        '200':
          description: List of referrals for an examination
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Referral'

components:
  schemas:
    # Patient schemas
    Patient:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date-time
        details:
          type: string
          
    CreatePatientRequest:
      type: object
      required:
        - firstName
        - lastName
        - birthDate
      properties:
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date-time
        details:
          type: string
          
    UpdatePatientRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date-time
        details:
          type: string
    
    # Examination schemas
    Examination:
      type: object
      properties:
        id:
          type: integer
        patientID:
          type: integer
        examDate:
          type: string
          format: date-time
        anamnesis:
          type: string
        diagnosis:
          type: string
          
    CreateExaminationRequest:
      type: object
      required:
        - patientId
        - examDate
      properties:
        patientId:
          type: integer
        examDate:
          type: string
          format: date-time
        anamnesis:
          type: string
        diagnosis:
          type: string
          
    UpdateExaminationRequest:
      type: object
      properties:
        examDate:
          type: string
          format: date-time
        anamnesis:
          type: string
        diagnosis:
          type: string
    
    # Sample schemas
    Sample:
      type: object
      properties:
        id:
          type: integer
        examinationID:
          type: integer
        sampleType:
          type: string
        result:
          type: string
          
    SampleRequest:
      type: object
      required:
        - examinationId
        - sampleType
      properties:
        examinationId:
          type: integer
        sampleType:
          type: string
        result:
          type: string
          
    UpdateSampleRequest:
      type: object
      properties:
        sampleType:
          type: string
        result:
          type: string
    
    # Prescription schemas
    Prescription:
      type: object
      properties:
        id:
          type: integer
        examinationID:
          type: integer
        medication:
          type: string
        dosage:
          type: string
        instructions:
          type: string
        validated:
          type: boolean
        sent:
          type: boolean
          
    PrescriptionRequest:
      type: object
      required:
        - examinationId
        - medication
        - dosage
      properties:
        examinationId:
          type: integer
        medication:
          type: string
        dosage:
          type: string
        instructions:
          type: string
          
    UpdatePrescriptionRequest:
      type: object
      properties:
        medication:
          type: string
        dosage:
          type: string
        instructions:
          type: string
        validated:
          type: boolean
        sent:
          type: boolean
    
    # Referral schemas
    Referral:
      type: object
      properties:
        id:
          type: integer
        examinationID:
          type: integer
        specialist:
          type: string
        reason:
          type: string
          
    ReferralRequest:
      type: object
      required:
        - examinationId
        - specialist
        - reason
      properties:
        examinationId:
          type: integer
        specialist:
          type: string
        reason:
          type: string
          
    UpdateReferralRequest:
      type: object
      properties:
        specialist:
          type: string
        reason:
          type: string